name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test LlamadockCore
        run: swift test --package-path Packages/LlamadockCore

  app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Debug app
        run: >-
          xcodebuild
          -project Llamadock.xcodeproj
          -scheme Llamadock
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify release contract
        run: Scripts/verify-release-contract.sh
